<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./jsm/"}}</script>
<style>
@font-face{font-family:P;src:url(Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:P;src:url(Poppins-Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:P,sans-serif;position:relative}
#bg{position:absolute;inset:0}
.tag{position:absolute;top:120px;left:70px;font-size:26px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--ac)}
.tag i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:14px;vertical-align:2px;background:var(--ac)}
.logo{position:absolute;top:108px;right:150px;width:180px}
.num{position:absolute;top:118px;right:70px;font-size:28px;font-weight:700;color:#1B9A4B;width:70px;text-align:right}
#title{position:absolute;top:176px;left:70px;right:60px}
h1{font-size:58px;line-height:1.1;font-weight:700;letter-spacing:-1.6px;color:var(--dk)}
h1 em{font-style:normal;color:var(--ac)}
#stage{position:absolute;left:50px;top:345px;width:980px;height:1040px;border-radius:44px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.24);background:#5a3a1e}
#stage canvas{display:block;width:980px;height:1040px}
#sub{position:absolute;left:60px;right:60px;top:1415px;background:#fff;border-radius:32px;padding:26px 36px 30px;box-shadow:0 14px 40px rgba(0,0,0,.10);min-height:176px;transform-origin:50% 0}
#sub .who{font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--ac)}
#sub .tx{font-size:41px;font-weight:700;line-height:1.2;color:var(--dk);margin-top:6px}
#sub .tx em{font-style:normal;color:var(--em)}
#sub.cta{background:var(--dk)}
#sub.cta .who{color:#9FE6B8}
#sub.cta .tx{color:#fff}
#sub.cta .tx em{font-style:normal;color:#9FE6B8}
</style></head><body>
<div id="bg"></div>
<div class="tag"><i></i><span>Chi blocca chi</span></div>
<img class="logo" src="logo_s4.png"><div class="num" id="num"></div>
<div id="title"><h1 id="h1"></h1></div>
<div id="stage"><canvas id="c" width="980" height="1040"></canvas></div>
<div id="sub"><div class="who" id="who"></div><div class="tx" id="tx"></div></div>
<script type="module">
const Q=new URLSearchParams(location.search),mode=Q.get('mode')||'both';
const VID=await(await fetch(`aud/${Q.get('vid')}.json`)).json();
await document.fonts.load('700 100px P');await document.fonts.load('500 100px P');
const PAL={viola:['#6B3FA0','#2A1445','#F6F1FB','#E0D2F2'],arancio:['#E64A19','#4A160A','#FEF2EC','#F9D9CB'],blu:['#2E7DB5','#0E2F47','#EFF5FB','#D0E3F2'],
 marrone:['#9A5A24','#3B2412','#FBF4EA','#EBD5B9'],verde:['#2B8A3E','#123D1C','#F1F8F1','#D3EAD5'],giallo:['#D99A00','#5A3E00','#FFF9E8','#FBEBB8']};
const NAMES={P:'Fosforo',K:'Potassio',N:'Azoto ammoniacale',Ca:'Calcio',Mg:'Magnesio',S:'Zolfo',Zn:'Zinco',Fe:'Ferro',Mn:'Manganese',Mo:'Molibdeno',nar:'Studio 4'};
const $=id=>document.getElementById(id),P=PAL[VID.pal],R=document.documentElement.style;
R.setProperty('--ac',P[0]);R.setProperty('--dk',P[1]);R.setProperty('--em',VID.pal==='giallo'?'#A87400':P[0]);$('bg').style.background=`linear-gradient(170deg,${P[2]} 0%,${P[3]} 100%)`;
$('num').textContent=VID.num;$('h1').innerHTML=VID.h;
{let fs=58;const h=$('h1');while(h.offsetHeight>fs*1.1*2+6&&fs>44){fs--;h.style.fontSize=fs+'px';h.style.letterSpacing=(-1.6*fs/58).toFixed(2)+'px'}}
const ez=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};
let last=-2;
function overlay(t){let cur=-1;VID.tl.forEach((l,i)=>{if(t>=l.start-0.06)cur=i});
 if(cur!==last){last=cur;const l=VID.tl[Math.max(0,cur)];$('sub').className=l.cta?'cta':'';$('who').textContent=NAMES[l.who];
  $('tx').innerHTML=l.text.replace(/'/g,'’').replace('Studio 4','<em>Studio 4</em>').replace(/((?:mi blocca|blocca anche me)(?:, e |: ))(.+)$/,'$1<em>$2</em>');
  {let fs=41;const x=$('tx');x.style.fontSize=fs+'px';while(x.offsetHeight>fs*1.2*2+4&&fs>33){fs--;x.style.fontSize=fs+'px'}}}
 const l=VID.tl[Math.max(0,cur)],e=cur<=0?1:ez((t-(l.start-0.06))/0.22);$('sub').style.transform=`translateY(${(1-e)*18}px) scale(${0.97+0.03*e})`;$('sub').style.opacity=0.35+0.65*e}
let stage=null;
if(mode!=='overlay'){const{createStage}=await import('./stage.js');stage=createStage($('c'),VID,{aa:Q.get('aa')||'smaa',ao:Q.get('ao')!=='0',gout:+(Q.get('gout')||0),aos:+(Q.get('aos')||0.5),sh:Q.get('sh')!=='0',soft:Q.get('soft')!=='0',lam:Q.get('lam')==='1'});window.stage=stage}
window.renderFrame=t=>{overlay(t);if(stage){stage.update(t);stage.render()}};
window.frameJPEG=t=>{stage.update(t);stage.render();return $('c').toDataURL('image/jpeg',0.95)};
await new Promise(r=>setTimeout(r,400));window.total=VID.total;window.ready=true;
</script></body></html>
